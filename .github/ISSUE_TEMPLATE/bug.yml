name: Report a bug
description: Report a non-security problem with AgentOffice
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "This is a public tracker. Never post passwords, API keys, personal data, private workspaces or vulnerability details. Read SECURITY.md for private security reporting."
  - type: input
    id: version
    attributes:
      label: Installed AgentOffice version
      placeholder: "Version shown in the app"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and architecture
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed sensitive information and this is not a vulnerability report.
          required: true
